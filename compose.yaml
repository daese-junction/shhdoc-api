services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=shhdoc'
      - 'MYSQL_USER=shhdoc'
      - 'MYSQL_PASSWORD=shhdoc'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 프로필 없음: mysql 처럼 로컬 개발에서도 필요하다.
    image: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
    command: server /data --console-address ':9001'
    environment:
      - 'MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-shhdoc}'
      - 'MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-shhdoc-local-secret}'
    volumes:
      - 'minio-data:/data'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # deploy 프로필에서만 뜬다. 없으면 ./gradlew bootRun 이 이 컨테이너까지 띄워
    # 로컬 JVM 과 8080 을 두고 다툰다. 서버는 --profile deploy 로 올린다.
    profiles: ['deploy']
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shhdoc'
      - 'SPRING_DATASOURCE_USERNAME=shhdoc'
      - 'SPRING_DATASOURCE_PASSWORD=shhdoc'
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'STORAGE_ENDPOINT=http://minio:9000'
      - 'STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-https://shhdoc-storage.daeonlab.com}'
      - 'STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-shhdoc}'
      - 'STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-shhdoc-local-secret}'
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: on-failure

  nginx:
    profiles: ['deploy']
    image: 'nginx:1.27'
    volumes:
      - './deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
    depends_on:
      - app
      - minio
    ports:
      - '80:80'

volumes:
  minio-data:
