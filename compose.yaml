services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=shhdoc'
      - 'MYSQL_USER=shhdoc'
      - 'MYSQL_PASSWORD=shhdoc'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shhdoc'
      - 'SPRING_DATASOURCE_USERNAME=shhdoc'
      - 'SPRING_DATASOURCE_PASSWORD=shhdoc'
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: on-failure

  nginx:
    image: 'nginx:1.27'
    volumes:
      - './deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
    depends_on:
      - app
    ports:
      - '80:80'
