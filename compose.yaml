services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=shhdoc'
      - 'MYSQL_USER=shhdoc'
      - 'MYSQL_PASSWORD=shhdoc'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3306:3306'

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shhdoc'
      - 'SPRING_DATASOURCE_USERNAME=shhdoc'
      - 'SPRING_DATASOURCE_PASSWORD=shhdoc'
    depends_on:
      - mysql
    ports:
      - '8080:8080'

  nginx:
    image: 'nginx:1.27'
    volumes:
      - './deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
    depends_on:
      - app
    ports:
      - '80:80'
