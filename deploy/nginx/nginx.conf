events {}

http {
  # 도커 내장 DNS. proxy_pass 에 이름을 그대로 쓰면 nginx 가 기동 때 한 번만 주소를 찾고
  # 그 값을 계속 쓴다. 배포로 app 컨테이너가 새로 뜨면 IP 가 바뀌어 502 가 난다.
  # 아래처럼 변수로 넘기면 요청마다 다시 찾는다.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    # 안 적으면 nginx 기본값 1m 이라 본문 긴 메일이 413 으로 잘린다.
    # 첨부는 이 경로로 오지 않는다 (스토리지 서브도메인으로 직접 간다).
    client_max_body_size 10m;

    location / {
      set $app_upstream http://app:8080;
      proxy_pass $app_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 스토리지 전용. 서명 URL 에는 호스트가 포함되므로 경로를 갈아끼우면 안 되고,
  # Host 헤더도 그대로 넘겨야 MinIO 가 서명을 다시 계산해 맞출 수 있다.
  # (그래서 /storage 같은 경로 프리픽스가 아니라 서브도메인을 쓴다)
  #
  # 이름에 점이 하나여야 한다. Cloudflare 무료 인증서가 *.daeonlab.com 까지만 덮어서
  # storage.shhdoc.daeonlab.com 처럼 두 단계면 HTTPS 가 깨진다.
  server {
    listen 80;
    server_name shhdoc-storage.daeonlab.com;

    # 첨부 최대 크기. 기본값 1m 이면 업로드가 413 으로 막힌다.
    client_max_body_size 25m;

    location / {
      set $minio_upstream http://minio:9000;
      proxy_pass $minio_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
    }
  }
}
