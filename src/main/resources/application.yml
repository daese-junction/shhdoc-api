jwt:
  # 로컬 개발용 기본값. 배포는 JWT_SECRET 환경변수로 반드시 덮어쓸 것 (HS256이라 32바이트 이상)
  secret: ${JWT_SECRET:local-dev-secret-change-me-32bytes-min!!}
  access-validity-minutes: 30
  refresh-validity-days: 7

storage:
  # 앱 → MinIO (도커 네트워크 내부). 로컬 bootRun 은 localhost.
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  # 서명 URL 에 들어갈 주소. 브라우저가 직접 여는 주소라 밖에서 접근 가능해야 한다.
  # 서명에 호스트가 포함되므로 이 값이 틀리면 SignatureDoesNotMatch 가 난다.
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:shhdoc-attachments}
  access-key: ${STORAGE_ACCESS_KEY:shhdoc}
  secret-key: ${STORAGE_SECRET_KEY:shhdoc-local-secret}
  presign-minutes: 15

cors:
  # 배포된 프론트 + 로컬 개발 주소. 끝에 / 를 붙이지 말 것 (Origin 헤더와 문자열이 정확히 일치해야 함)
  allowed-origins: >-
    ${CORS_ALLOWED_ORIGINS:https://mail.shhdoc.daeonlab.com,http://localhost:3000,http://localhost:5173}

logging:
  pattern:
    # TraceIdFilter가 MDC에 심는 traceId를 로그 레벨 옆에 붙인다. 요청이 없는 컨텍스트
    # (upstage 비동기 파이프라인 등)는 traceId가 없으니 "-"로 찍힌다.
    level: "%5p [%X{traceId:-}]"

spring:
  application:
    name: shhdoc-api
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

upstage:
  api-key: ${UPSTAGE_API_KEY:}
  document-parse-url: ${UPSTAGE_DOCUMENT_PARSE_URL:https://api.upstage.ai/v1/document-digitization}
  document-classify-url: ${UPSTAGE_DOCUMENT_CLASSIFY_URL:https://api.upstage.ai/v1/document-classification/chat/completions}
  information-extract-url: ${UPSTAGE_INFORMATION_EXTRACT_URL:https://api.upstage.ai/v1/information-extraction/chat/completions}
  generate-url: ${UPSTAGE_GENERATE_URL:https://api.upstage.ai/v1/chat/completions}
